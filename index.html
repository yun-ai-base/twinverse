<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧬 孪生宇宙 · TwinVerse</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>🧬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F2ED;
  --surface: #FFFFFF;
  --surface-hover: #FAF8F5;
  --border: #E8E4DE;
  --border-light: #F0EDE8;
  --text: #2C2A28;
  --text-secondary: #8A8680;
  --text-muted: #B8B4AE;
  --accent: #8B7E6A;
  --accent-light: rgba(139,126,106,0.08);
  --accent-line: rgba(139,126,106,0.2);
  --gold: #C4A87C;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 3px rgba(44,42,40,0.04);
  --shadow-hover: 0 8px 32px rgba(44,42,40,0.06);
  --font-serif: 'Noto Serif SC', 'Georgia', serif;
  --font-sans: 'Inter', -apple-system, 'PingFang SC', sans-serif;
  --font-mono: 'DM Mono', 'SF Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  line-height: 1.7;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* Header */
header {
  max-width: 820px;
  margin: 0 auto;
  padding: 72px 24px 20px;
  text-align: center;
}

header .logo {
  font-size: 44px;
  display: block;
  margin-bottom: 16px;
  filter: saturate(0.7);
}

header h1 {
  font-family: var(--font-serif);
  font-size: clamp(1.6rem, 4vw, 2.4rem);
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}

header h1 span { color: var(--gold); }

header .subtitle {
  font-size: 0.9rem;
  color: var(--text-secondary);
  letter-spacing: 0.06em;
}

header::after {
  content: '';
  display: block;
  width: 48px;
  height: 2px;
  background: var(--accent-line);
  margin: 24px auto 0;
}

/* Loading */
.loading {
  text-align: center;
  padding: 80px 24px;
  color: var(--text-muted);
  font-size: 0.85rem;
}

.loading .spinner {
  width: 28px; height: 28px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 14px;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Container */
.container {
  max-width: 820px;
  margin: 0 auto;
  padding: 0 24px 48px;
}

/* Category sections */
.category-section {
  margin-bottom: 44px;
  animation: fadeUp 0.5s ease forwards;
  opacity: 0;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.category-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-light);
}

.category-header .cat-icon { font-size: 18px; }

.category-header h2 {
  font-family: var(--font-serif);
  font-size: 1rem;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.04em;
}

.category-header .cat-count {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-left: auto;
}

/* Project grid */
.project-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 10px;
}

.project-card {
  display: flex;
  flex-direction: column;
  padding: 18px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  text-decoration: none;
  color: inherit;
  transition: all 0.25s ease;
  position: relative;
}

.project-card:hover {
  border-color: var(--accent);
  box-shadow: var(--shadow-hover);
  background: var(--surface-hover);
  transform: translateY(-2px);
}

.card-icon {
  font-size: 24px;
  margin-bottom: 10px;
  line-height: 1;
}

.project-card h3 {
  font-family: var(--font-serif);
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
  line-height: 1.4;
}

.project-card p {
  font-size: 0.8rem;
  color: var(--text-secondary);
  line-height: 1.5;
  flex: 1;
}

.card-arrow {
  position: absolute;
  top: 16px;
  right: 16px;
  font-size: 0.85rem;
  color: var(--text-muted);
  opacity: 0;
  transform: translate(-4px, 4px);
  transition: all 0.25s ease;
}

.project-card:hover .card-arrow {
  opacity: 1;
  color: var(--accent);
  transform: translate(0, 0);
}

/* Footer */
footer {
  max-width: 820px;
  margin: 0 auto;
  padding: 24px;
  text-align: center;
  border-top: 1px solid var(--border-light);
}

footer p {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--text-muted);
  letter-spacing: 0.05em;
}

/* Responsive */
@media (max-width: 640px) {
  header { padding: 48px 16px 16px; }
  header .logo { font-size: 36px; }
  header::after { margin-top: 18px; }

  .container { padding: 0 16px 32px; }
  .project-grid { grid-template-columns: 1fr; }
  .category-section { margin-bottom: 32px; }
}

@media (max-width: 400px) {
  header { padding: 36px 12px 12px; }
  header h1 { font-size: 1.3rem; }
  .project-card { padding: 14px 16px; }
}
</style>
</head>
<body>

<header>
  <span class="logo">🧬</span>
  <h1>孪生宇宙 · <span>TwinVerse</span></h1>
  <p class="subtitle">我的全部项目 · 自动同步</p>
</header>

<div class="container" id="mainContent">
  <div class="loading">
    <div class="spinner"></div>
    正在加载…
  </div>
</div>

<footer>
  <p>数据来自 psychscope/projects.json · 自动同步</p>
</footer>

<script>
const PROJECT_NAMES = {
  psychscope: '心理学大师图谱',
  sciomap: '科学星图',
  philomap: '哲学星球',
  'writers-gallery': '百位作家画廊',
  'morris-quotes': 'Morris 语录集',
  'research-frontiers': '全球科研突破',
  'cosmic-discussion': '宇宙大爆炸对话',
  'being-towards-death': '向死而生',
  'cognitive-biases-atlas': '认知偏见图谱',
  'book-gallery': '我的书房',
  'poetry-glory-world': '中国诗词人世界',
  'chinese-colors': '中国传统色彩',
  'math-giants': '数学史上的巨人'
};

const CATEGORY_MAP = {
  ai:      { label: 'AI / 智能体', icon: '🤖' },
  content: { label: '内容精选',    icon: '📖' },
  tool:    { label: '工具',       icon: '🛠️' },
};
const CAT_ORDER = ['ai', 'content', 'tool'];

async function loadProjects() {
  try {
    const res = await fetch('https://yun-ai-base.github.io/psychscope/projects.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    render(await res.json());
  } catch (e) {
    document.getElementById('mainContent').innerHTML =
      '<div class="loading" style="color:#B8B4AE">加载失败: ' + e.message + '</div>';
  }
}

function render(projects) {
  const byCat = {};
  projects.forEach(p => { (byCat[p.cat] = byCat[p.cat] || []).push(p); });

  let html = '';
  CAT_ORDER.forEach(cat => {
    const list = byCat[cat];
    if (!list) return;
    const info = CATEGORY_MAP[cat];
    html += '<section class="category-section">'
      + '<div class="category-header">'
      + '<span class="cat-icon">' + info.icon + '</span>'
      + '<h2>' + info.label + '</h2>'
      + '<span class="cat-count">' + list.length + '</span>'
      + '</div>'
      + '<div class="project-grid">';
    list.forEach((p, i) => {
      html += '<a class="project-card" href="https://yun-ai-base.github.io/' + p.name + '/" target="_blank" rel="noopener" style="animation-delay:' + (i * 0.05).toFixed(2) + 's">'
        + '<span class="card-arrow">↗</span>'
        + '<div class="card-icon">' + (p.icon || '📄') + '</div>'
        + '<h3>' + (PROJECT_NAMES[p.name] || p.name) + '</h3>'
        + '<p>' + (p.desc || '') + '</p>'
        + '</a>';
    });
    html += '</div></section>';
  });
  document.getElementById('mainContent').innerHTML = html;
}

loadProjects();
</script>

</body>
</html>
